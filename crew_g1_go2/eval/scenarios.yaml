# 20 distinct scenarios (12 nominal + 8 fault) with prompt/object/location
# variation across the four families. Faults are designed to survive a
# retrieval-equipped planner (substituted/invalid destinations, and state-level
# robot-unavailable faults the planner cannot see or launder).

# ---- Nominal: handover (3) ----
- id: nom_handover_1
  request: "I'm right here at the table, hand me the red cube"
  expected_family: handover
  expected_robots: [g1]
  fault: none
  should_block: false
- id: nom_handover_2
  request: "I'm sitting at the table — pass me the block please"
  expected_family: handover
  expected_robots: [g1]
  fault: none
  should_block: false
- id: nom_handover_3
  request: "give me the bottle, I'm standing right at the table"
  expected_family: handover
  expected_robots: [g1]
  fault: none
  should_block: false

# ---- Nominal: carry (3) ----
- id: nom_carry_1
