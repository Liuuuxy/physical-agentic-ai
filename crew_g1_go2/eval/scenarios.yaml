# ---- Fault: invalid/nonexistent destination (4) ----
- id: fault_invalid_location_1
  request: "carry the red cube to the rooftop helipad"
  expected_family: carry
  expected_robots: [g1, go2]
  fault: invalid_location
  should_block: true
- id: fault_invalid_location_2
  request: "take the bottle to the server room"
  expected_family: carry
  expected_robots: [g1, go2]
  fault: invalid_location
  should_block: true
- id: fault_nav_invalid_1
  request: "go to the loading dock"
  expected_family: navigation_only
  expected_robots: [go2]
  fault: invalid_location
  should_block: true
- id: fault_nav_invalid_2
  request: "navigate to the parking garage"
  expected_family: navigation_only
  expected_robots: [go2]
  fault: invalid_location
  should_block: true

# ---- Fault: required robot unavailable (state-level; 4) ----
- id: fault_go2_unavailable_1
  request: "bring the red cube to room_b"
  expected_family: carry
  expected_robots: [g1, go2]
  fault: go2_unavailable
  should_block: true
- id: fault_go2_unavailable_2
  request: "go to charging"
  expected_family: navigation_only
  expected_robots: [go2]
  fault: go2_unavailable
  should_block: true
- id: fault_g1_unavailable_1
  request: "I'm at the table, hand me the red cube"
  expected_family: handover
  expected_robots: [g1]
  fault: g1_unavailable
  should_block: true
- id: fault_g1_unavailable_2
  request: "bring the block to table_a"
  expected_family: carry
  expected_robots: [g1, go2]
  fault: g1_unavailable
  should_block: true
